name: Terraform Plan

on:
  pull_request_target:
    paths:
      - 'infra/github/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  plan:
    if: github.repository_owner == 'aletheia-works'
    uses: aletheia-works/.github/.github/workflows/terraform-plan.yml@4f9b6d6865f083952f13557c91eaf839045e55e1 # v1.0.0
    with:
      working_directory: infra/github
    secrets: inherit
